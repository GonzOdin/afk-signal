# Change the app name to whatever you picked on Fly.io.
app = "afk-apocalypse-play"
primary_region = "sjc"

[env]
  PORT = "9000"

[http_service]
  internal_port = 9000
  force_https = true
  auto_stop_machines = "stop"   # keep it awake: a sleeping lobby misses joins
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    hard_limit = 500
    soft_limit = 400


[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
